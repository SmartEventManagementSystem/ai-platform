apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-service

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: ems-platform
  app.kubernetes.io/managed-by: argocd

commonAnnotations:
  argocd.argoproj.io/manifest-generate-labels: "true"
