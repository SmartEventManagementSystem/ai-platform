apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: ai-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ai-service
          image: ghcr.io/smarteventmanagementsystem/ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9091
              name: metrics
          env:
            - name: KAFKA_BROKERS
              value: "kafka.dataplatform.svc.cluster.local:9092"
            - name: REDIS_HOST
              value: "redis.dataplatform.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
