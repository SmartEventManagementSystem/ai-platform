apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-service
  namespace: ai-service
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api-ai.ems.local
      secretName: ai-service-tls
  rules:
    - host: api-ai.ems.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 80
