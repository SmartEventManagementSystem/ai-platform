apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/ems-project/ai-service:v1.0.0
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9091
              name: metrics
          env:
            - name: PORT
              value: "8081"
            - name: METRICS_PORT
              value: "9091"
            - name: ENVIRONMENT
              value: "production"
            - name: KAFKA_BROKERS
              value: "kafka.dataplatform.svc.cluster.local:9092"
            - name: REDIS_URL
              value: "redis.dataplatform.svc.cluster.local:6379"
            - name: EVENT_SERVICE_URL
              value: "http://event-service.event-service.svc.cluster.local:8080"
            - name: VECTOR_DB_URL
              value: "http://qdrant.dataplatform.svc.cluster.local:6333"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
